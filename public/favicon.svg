<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Docker container shape -->
  <g transform="translate(256, 256)">
    <!-- Main container box -->
    <rect x="-120" y="-80" width="240" height="160" rx="16" fill="none" stroke="url(#icon)" stroke-width="20"/>
    
    <!-- Workflow arrows inside -->
    <g fill="url(#icon)">
      <!-- Arrow 1 -->
      <circle cx="-60" cy="-20" r="16"/>
      <path d="M -60 -20 L 0 -20" stroke="url(#icon)" stroke-width="8" fill="none" stroke-linecap="round"/>
      
      <!-- Arrow 2 -->
      <circle cx="0" cy="-20" r="16"/>
      <path d="M 0 -20 L 60 -20" stroke="url(#icon)" stroke-width="8" fill="none" stroke-linecap="round"/>
      
      <!-- Arrow 3 -->
      <circle cx="60" cy="-20" r="16"/>
      
      <!-- Database cylinder -->
      <ellipse cx="0" cy="40" rx="40" ry="12" fill="none" stroke="url(#icon)" stroke-width="8"/>
      <path d="M -40 40 L -40 60 Q -40 72 0 72 Q 40 72 40 60 L 40 40" fill="none" stroke="url(#icon)" stroke-width="8"/>
    </g>
  </g>
</svg>
